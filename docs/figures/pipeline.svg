<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="21" font-weight="600" fill="#14213d">OA-MAE pipeline: from acquisition to a verified release</text>
  <text x="30" y="62" font-size="13" fill="#5b6478">Every stage writes a manifest. Stages 23 and 24 close the loop by recomputing the published values from the archived arrays.</text>

  <g stroke="#c8cede" stroke-width="1" fill="#f7f8fb">
    <rect x="30" y="86" width="1120" height="104" rx="8"/>
    <rect x="30" y="206" width="1120" height="104" rx="8"/>
    <rect x="30" y="326" width="1120" height="104" rx="8"/>
    <rect x="30" y="446" width="1120" height="140" rx="8"/>
  </g>
  <g font-size="12" font-weight="600" fill="#7a8296">
    <text x="44" y="106">1. ACQUISITION AND OBSERVABILITY</text>
    <text x="44" y="226">2. LABELS AND SPLITS</text>
    <text x="44" y="346">3. TRAINING</text>
    <text x="44" y="466">4. EVALUATION, VERIFICATION AND RELEASE</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a6"/>
    </marker>
  </defs>

  <g font-size="12.5" fill="#14213d">
    <g fill="#e8f0fe" stroke="#4a76c4" stroke-width="1.4">
      <rect x="52" y="120" width="190" height="50" rx="6"/>
      <rect x="272" y="120" width="190" height="50" rx="6"/>
      <rect x="492" y="120" width="190" height="50" rx="6"/>
      <rect x="712" y="120" width="190" height="50" rx="6"/>
      <rect x="932" y="120" width="196" height="50" rx="6"/>
    </g>
    <g fill="#14213d">
      <text x="66" y="140" font-weight="600">01 resolve areas</text><text x="66" y="158" font-size="11" fill="#5b6478">256 px tiles, local UTM</text>
      <text x="286" y="140" font-weight="600">02 - 03 acquisitions</text><text x="286" y="158" font-size="11" fill="#5b6478">S2 dates, S1 within 6 days</text>
      <text x="506" y="140" font-weight="600">04 rasters</text><text x="506" y="158" font-size="11" fill="#5b6478">10 optical bands, VV and VH</text>
      <text x="726" y="140" font-weight="600">05 external support</text><text x="726" y="158" font-size="11" fill="#5b6478">token cloud, V12, eq. 1 to 3</text>
      <text x="946" y="140" font-weight="600">scene bundles</text><text x="946" y="158" font-size="11" fill="#5b6478">the contract in data.py</text>
    </g>

    <g fill="#fdf0e4" stroke="#c98a3c" stroke-width="1.4">
      <rect x="52" y="240" width="250" height="50" rx="6"/>
      <rect x="332" y="240" width="250" height="50" rx="6"/>
      <rect x="612" y="240" width="250" height="50" rx="6"/>
    </g>
    <g fill="#14213d">
      <text x="66" y="260" font-weight="600">06 propose and prepare</text><text x="66" y="278" font-size="11" fill="#5b6478">Open Buildings candidates</text>
      <text x="346" y="260" font-weight="600">07 two annotators, adjudication</text><text x="346" y="278" font-size="11" fill="#5b6478">human decisions, not generated</text>
      <text x="626" y="260" font-weight="600">08 leave-one-city-out splits</text><text x="626" y="278" font-size="11" fill="#5b6478">6 folds, K in 10 25 50, 10 seeds</text>
    </g>

    <g fill="#e9f5ec" stroke="#4f9d69" stroke-width="1.4">
      <rect x="52" y="360" width="330" height="50" rx="6"/>
      <rect x="412" y="360" width="330" height="50" rx="6"/>
      <rect x="772" y="360" width="356" height="50" rx="6"/>
    </g>
    <g fill="#14213d">
      <text x="66" y="380" font-weight="600">20 Stage I pretraining</text><text x="66" y="398" font-size="11" fill="#5b6478">Cloud-Mix, past-only targets, one run per fold</text>
      <text x="426" y="380" font-weight="600">21 Stage II few-shot</text><text x="426" y="398" font-size="11" fill="#5b6478">frozen encoders, focal and Dice on V12</text>
      <text x="786" y="380" font-weight="600">checkpoints with identity</text><text x="786" y="398" font-size="11" fill="#5b6478">commit, config, split and normalization hashes</text>
    </g>

    <g fill="#eeeaf7" stroke="#7a68b0" stroke-width="1.4">
      <rect x="52" y="480" width="168" height="46" rx="6"/>
      <rect x="240" y="480" width="168" height="46" rx="6"/>
      <rect x="428" y="480" width="168" height="46" rx="6"/>
      <rect x="616" y="480" width="168" height="46" rx="6"/>
      <rect x="804" y="480" width="168" height="46" rx="6"/>
      <rect x="992" y="480" width="136" height="46" rx="6"/>
    </g>
    <g fill="#14213d">
      <text x="66" y="500" font-weight="600">09 - 10 inference</text><text x="66" y="516" font-size="11" fill="#5b6478">through the adapter</text>
      <text x="254" y="500" font-weight="600">11 metrics</text><text x="254" y="516" font-size="11" fill="#5b6478">on V12, per sample</text>
      <text x="442" y="500" font-weight="600">23 aggregation</text><text x="442" y="516" font-size="11" fill="#5b6478">runs and summary</text>
      <text x="630" y="500" font-weight="600">12 - 13 figures</text><text x="630" y="516" font-size="11" fill="#5b6478">selection frozen first</text>
      <text x="818" y="500" font-weight="600">22 compute</text><text x="818" y="516" font-size="11" fill="#5b6478">params, FLOPs, latency</text>
      <text x="1006" y="500" font-weight="600">14 - 15 release</text><text x="1006" y="516" font-size="11" fill="#5b6478">checksums</text>
    </g>

    <rect x="52" y="540" width="1076" height="34" rx="6" fill="#fdecef" stroke="#c05a6e" stroke-width="1.4"/>
    <text x="66" y="562" font-weight="600">24 traceability</text>
    <text x="178" y="562" font-size="11.5" fill="#5b6478">thresholding, support identity, metric identity, aggregation identity and manuscript values are each recomputed and counted</text>
  </g>

  <g stroke="#8b93a6" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M 242 145 L 268 145"/><path d="M 462 145 L 488 145"/><path d="M 682 145 L 708 145"/><path d="M 902 145 L 928 145"/>
    <path d="M 302 265 L 328 265"/><path d="M 582 265 L 608 265"/>
    <path d="M 382 385 L 408 385"/><path d="M 742 385 L 768 385"/>
    <path d="M 220 503 L 236 503"/><path d="M 408 503 L 424 503"/><path d="M 596 503 L 612 503"/><path d="M 784 503 L 800 503"/><path d="M 972 503 L 988 503"/>
    <path d="M 1030 170 L 1030 190 L 590 190 L 590 236"/>
    <path d="M 737 290 L 737 306 L 217 306 L 217 356"/>
    <path d="M 950 410 L 950 430 L 136 430 L 136 476"/>
  </g>
</svg>
